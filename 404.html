<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Opening WithYou…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #F7F6F3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 16px;
      color: #2F2F2F;
    }
    p { color: #8A8A8A; font-size: 15px; }
  </style>
</head>
<body>
  <div style="font-size:48px">❤️</div>
  <h2 style="margin:0">Opening WithYou…</h2>
  <p>If nothing happens, make sure WithYou is installed.</p>
  <script>
    // Strip the /withyou-join prefix from the path, keep the rest (pairCode + query params)
    // e.g. /withyou-join/ABC123?from=...&name=Sara → withyou://join/ABC123?from=...&name=Sara
    var path = window.location.pathname.replace(/^\/withyou-join\/?/, '');
    var query = window.location.search;
    var deepLink = 'withyou://join/' + path + query;
    window.location.replace(deepLink);
  </script>
</body>
</html>
